
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <h2>⚡ TaskFlow</h2>
        <p>PRODUCTIVITY</p>

        <nav>
            <a class="active" href="#">Dashboard</a>
            <a href="#tasks">My Tasks</a>
        </nav>

        <div class="sidebar-bottom">
            <p>Stay focused.</p>
            <small>One task at a time.</small>
        </div>
    </aside>

    <main class="main-content">
        <header>
            <div>
                <h1>My Dashboard</h1>
                <p>Manage your daily productivity.</p>
            </div>
            <span class="avatar">M</span>
        </header>

        <section class="stats">
            <div class="stat-card">
                <span>Total Tasks</span>
                <h2 id="totalTasks">0</h2>
            </div>

            <div class="stat-card">
                <span>Completed</span>
                <h2 id="completedTasks">0</h2>
            </div>

            <div class="stat-card">
                <span>Pending</span>
                <h2 id="pendingTasks">0</h2>
            </div>
        </section>

        <section class="task-section" id="tasks">
            <div class="section-heading">
                <div>
                    <h2>My Tasks</h2>
                    <p>Organize your work efficiently.</p>
                </div>
                <button id="openForm">+ Add Task</button>
            </div>

            <div class="toolbar">
                <input type="search" id="searchTask"
                       placeholder="Search tasks...">

                <select id="filterTask">
                    <option value="all">All Tasks</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <form id="taskForm" class="task-form">
                <h3>Create New Task</h3>

                <input type="text" id="taskTitle"
                       placeholder="Task title" required>

                <textarea id="taskDescription"
                          placeholder="Task description"></textarea>

                <div class="form-row">
                    <select id="taskPriority">
                        <option value="Low">Low Priority</option>
                        <option value="Medium">Medium Priority</option>
                        <option value="High">High Priority</option>
                    </select>

                    <input type="date" id="taskDate" required>
                </div>

                <button type="submit">Save Task</button>
                <button type="button" id="cancelForm" class="cancel">
                    Cancel
                </button>
            </form>

            <div id="taskList" class="task-list"></div>

            <p id="emptyMessage" class="empty-message">
                No tasks found. Create your first task!
            </p>
        </section>
    </main>
</div>

</body>
</html>
